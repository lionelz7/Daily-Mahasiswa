<script>
    /* DATA STORAGE & SCALING CONFIG */
    let socialStats = JSON.parse(localStorage.getItem('p_stats')) || {
      knowledge: { exp: 0, rank: 1 },
      charm: { exp: 0, rank: 1 },
      guts: { exp: 0, rank: 1 },
      kindness: { exp: 0, rank: 1 },
      proficiency: { exp: 0, rank: 1 }
    };

    const rankTitles = {
      knowledge: ["Sering Bolos Kuliah", "Paham Matkul Dasar", "Juara Kelas Matkul", "Rujukan Catatan Teman", "Ensiklopedia Kampus"],
      charm: ["Kupu-Kupu (Kuliah Pulang)", "Aktif Sapa Dosen", "Bintang Panitia BEM", "Public Speaker Kampus", "Karismatik Idaman Kampus"],
      guts: ["Takut Nemu Dosen Killer", "Berani Angkat Tangan", "Berani Beda Pendapat", "Nego Deadline Tugas", "Raja Debat Kampus"],
      kindness: ["Individualis Bekerja Alone", "Bantu Temen Dekat", "Rutin Share Rangkuman", "Penyelamat Kelompok", "Matahari Jurusan"],
      proficiency: ["Ngetik Laporan 2 Jari", "Cepat Ketik Format", "Master Excel & Word", "Full-Stack Student", "Satu Hari Kelar Skripsi"]
    };

    let tasks = JSON.parse(localStorage.getItem('p_tasks')) || [
      { id: 1, title: 'Laporan Praktikum Jaringan Komputer', subject: 'Praktikum Jaringan Komputer', deadline: 'Senin, 6 Okt 2025', category: 'Palace Infiltration', done: false },
      { id: 2, title: 'Presentasi Slide PBO', subject: 'Pemrograman Berorientasi Obyek', deadline: 'Rabu, 8 Okt 2025', category: 'Boss Battle', done: false }
    ];

    let socialLinks = JSON.parse(localStorage.getItem('p_links')) || [];

    const defaultSchedule = [
      { day: "Senin", time: "07.00 - 09.00", subject: "Praktikum Jaringan Komputer", room: "Lab Baru 1 Gedung D" },
      { day: "Senin", time: "11.35 - 13.50", subject: "Komunikasi Data", room: "Gedung Teknik C 206" },
      
      { day: "Selasa", time: "09.45 - 12.25", subject: "Matematika Diskret", room: "Gedung Teknik C 206" },
      
      { day: "Rabu", time: "07.00 - 09.40", subject: "Kalkulus", room: "Gedung Teknik C 206" },
      { day: "Rabu", time: "11.35 - 13.50", subject: "Organisasi dan Arsitektur Komputer", room: "Gedung Teknik E 104" },
      
      { day: "Kamis", time: "07.00 - 09.40", subject: "Sistem Basis Data", room: "Gedung Teknik C 206" },
      { day: "Kamis", time: "11.35 - 13.59", subject: "Etika Profesi", room: "Gedung Teknik C 205" },
      { day: "Kamis", time: "15.00 - 17.00", subject: "Praktikum Elektronika Dasar", room: "Lab Multimedia Gedung D" },
      
      { day: "Jumat", time: "07.00 - 08.45", subject: "Sistem Cerdas", room: "Gedung Teknik C 202" },
      { day: "Jumat", time: "08.50 - 11.30", subject: "Pemrograman Berorientasi Obyek", room: "Gedung Teknik C 202" },
      { day: "Jumat", time: "15.40 - 17.40", subject: "Praktikum Pemrograman Berorientasi Obyek", room: "Lab Pemrograman Gedung D" }
    ];

    /* AUDIO MANAGEMENT SYSTEM */
    window.masterMuted = false;
    window.sfxEnabled = true;

    const audioP5 = document.getElementById('audio-p5');
    const audioP4 = document.getElementById('audio-p4');
    const audioP3 = document.getElementById('audio-p3');

    let activeMusic = audioP5; // Default to P5 Last Surprise

    audioP5.volume = 0.5;
    audioP4.volume = 0.5;
    audioP3.volume = 0.5;

    function stopAllMusic() {
      audioP5.pause();
      audioP4.pause();
      audioP3.pause();
    }

    function playActiveMusic() {
      if (window.masterMuted) return;
      stopAllMusic();
      activeMusic.currentTime = 0;
      activeMusic.play().catch(e => console.log("Audio play deferred:", e));
    }

    function toggleMasterMusic() {
      window.masterMuted = !window.masterMuted;
      updateMusicButtonUI();
      if (window.masterMuted) {
        stopAllMusic();
      } else {
        playActiveMusic();
      }
    }

    function updateMusicButtonUI() {
      const btn = document.getElementById('master-music-toggle');
      const text = document.getElementById('music-text');
      const icon = document.getElementById('music-icon');

      if (!btn) return;
      if (window.masterMuted) {
        btn.className = "p-2.5 bg-red-600 hover:bg-red-500 text-white border border-red-400 transition-all flex items-center gap-1.5";
        if (text) text.innerText = "BGM OFF";
        if (icon) icon.className = "fas fa-music text-sm text-white opacity-50";
      } else {
        btn.className = "p-2.5 bg-neutral-800 hover:bg-neutral-700 text-white border border-neutral-600 transition-all flex items-center gap-1.5";
        if (text) text.innerText = "BGM ON";
        if (icon) icon.className = "fas fa-music text-sm text-[var(--p-primary)]";
      }
    }

    function changeVolume(val) {
      const vol = parseFloat(val);
      audioP5.volume = vol;
      audioP4.volume = vol;
      audioP3.volume = vol;
    }

    function toggleSfx() {
      window.sfxEnabled = !window.sfxEnabled;
      const btn = document.getElementById('sfx-toggle');
      const icon = document.getElementById('sfx-icon');
      if (window.sfxEnabled) {
        icon.className = "fas fa-volume-high text-sm";
        btn.className = "p-2.5 bg-neutral-800 hover:bg-neutral-700 text-white border border-neutral-600 transition-all";
        playSfx('click');
      } else {
        icon.className = "fas fa-volume-xmark text-sm text-red-400";
        btn.className = "p-2.5 bg-red-950 text-red-200 border border-red-600 transition-all";
      }
    }

    function playSfx(type) {
      if (!window.sfxEnabled) return;
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'hover') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(500, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.04);
          gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.04);
        } else if (type === 'click') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(320, audioCtx.currentTime);
          osc.frequency.linearRampToValueAtTime(640, audioCtx.currentTime + 0.07);
          gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.07);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.07);
        } else if (type === 'levelup') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(440, audioCtx.currentTime);
          osc.frequency.setValueAtTime(554.37, audioCtx.currentTime + 0.08);
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.16);
          osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.24);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'velvet') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1046.5, audioCtx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.35);
        }
      } catch(e) {}
    }

    function setTheme(theme) {
      playSfx('click');
      document.body.classList.remove('theme-p3', 'theme-p4', 'theme-p5');
      document.body.classList.add(`theme-${theme}`);

      if (theme === 'p5') {
        activeMusic = audioP5;
      } else if (theme === 'p4') {
        activeMusic = audioP4;
      } else if (theme === 'p3') {
        activeMusic = audioP3;
      }

      if (!window.masterMuted) {
        playActiveMusic();
      }
    }

    /* STORAGE SAVE & STATS LOGIC */
    function saveData() {
      localStorage.setItem('p_stats', JSON.stringify(socialStats));
      localStorage.setItem('p_tasks', JSON.stringify(tasks));
      localStorage.setItem('p_links', JSON.stringify(socialLinks));
    }

    function renderStats() {
      for (let stat in socialStats) {
        const data = socialStats[stat];
        
        let currentRank = 1;
        let req1 = 200;
        let req2 = 400;
        let req3 = 600;
        let req4 = 800;

        let currentLevelBaseXp = 0;
        let currentLevelRequiredXp = req1;

        if (data.exp >= req1) {
          currentRank = 2;
          currentLevelBaseXp = req1;
          currentLevelRequiredXp = req2;
        }
        if (data.exp >= req1 + req2) {
          currentRank = 3;
          currentLevelBaseXp = req1 + req2;
          currentLevelRequiredXp = req3;
        }
        if (data.exp >= req1 + req2 + req3) {
          currentRank = 4;
          currentLevelBaseXp = req1 + req2 + req3;
          currentLevelRequiredXp = req4;
        }
        if (data.exp >= req1 + req2 + req3 + req4) {
          currentRank = 5;
          currentLevelBaseXp = req1 + req2 + req3 + req4;
          currentLevelRequiredXp = 1000;
        }

        data.rank = currentRank;

        document.getElementById(`rank-${stat}`).innerText = `RANK ${currentRank}`;
        document.getElementById(`title-${stat}`).innerText = rankTitles[stat][currentRank - 1];
        
        let progressInLevel = data.exp - currentLevelBaseXp;
        let percent = currentRank === 5 ? 100 : Math.min(100, Math.floor((progressInLevel / currentLevelRequiredXp) * 100));
        
        document.getElementById(`bar-${stat}`).style.width = `${percent}%`;
        
        if (currentRank === 5) {
          document.getElementById(`progress-${stat}`).innerText = `MAX RANK (${data.exp} XP)`;
        } else {
          document.getElementById(`progress-${stat}`).innerText = `${progressInLevel} / ${currentLevelRequiredXp} XP`;
        }
      }
    }

    function doActivity(stat, expGain) {
      playSfx('levelup');
      socialStats[stat].exp += expGain;
      saveData();
      renderStats();
    }

    /* RESET STATS MODAL & EXECUTION */
    function confirmResetStats() {
      playSfx('click');
      document.getElementById('reset-modal').classList.remove('hidden');
    }

    function closeResetModal() {
      playSfx('click');
      document.getElementById('reset-modal').classList.add('hidden');
    }

    function executeResetStats() {
      playSfx('levelup');
      socialStats = {
        knowledge: { exp: 0, rank: 1 },
        charm: { exp: 0, rank: 1 },
        guts: { exp: 0, rank: 1 },
        kindness: { exp: 0, rank: 1 },
        proficiency: { exp: 0, rank: 1 }
      };
      tasks = [];
      socialLinks = [];
      saveData();
      renderStats();
      renderTasks();
      renderSocialLinks();
      closeResetModal();
    }

    /* SCHEDULE FILTER */
    function filterSchedule(day) {
      playSfx('hover');
      document.querySelectorAll('.sched-tab').forEach(btn => {
        const btnDay = btn.getAttribute('data-day') || btn.innerText;
        if (btnDay.toLowerCase() === day.toLowerCase()) {
          btn.className = "sched-tab bg-[var(--p-primary)] text-black font-bebas text-xl px-5 py-2 p-slant font-bold shadow-md";
        } else {
          btn.className = "sched-tab bg-black text-white border border-white font-bebas text-xl px-5 py-2 p-slant font-bold";
        }
      });

      const container = document.getElementById('schedule-container');
      container.innerHTML = '';

      const filtered = defaultSchedule.filter(s => s.day.toLowerCase() === day.toLowerCase());
      if (filtered.length === 0) {
        container.innerHTML = `<div class="col-span-3 text-center text-gray-400 py-8 font-bebas text-2xl">TIDAK ADA JADWAL KULIAH HARI INI (LIBUR / NUGAS)</div>`;
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-black border-2 border-white p-5 jagged-box shadow-[6px_6px_0px_var(--p-primary)]";
        card.innerHTML = `
          <div class="flex justify-between items-start mb-2">
            <span class="text-xs bg-[var(--p-primary)] text-black px-2 py-0.5 font-bold font-mono">${item.time}</span>
            <span class="text-xs text-gray-400 font-bold"><i class="fas fa-map-marker-alt mr-1"></i>${item.room}</span>
          </div>
          <h3 class="text-2xl font-bebas text-white tracking-wide mb-1">${item.subject}</h3>
        `;
        container.appendChild(card);
      });
    }

    /* TASKS & QUEST LOG */
    function renderTasks() {
      const grid = document.getElementById('tasks-grid');
      grid.innerHTML = '';

      const categories = ["Palace Infiltration", "Boss Battle", "Mini Quest"];
      
      categories.forEach(cat => {
        const col = document.createElement('div');
        col.className = "bg-black border-2 border-white p-4 jagged-box shadow-[6px_6px_0px_#000]";
        
        let catHeaderClass = "bg-red-600 text-white";
        if (cat === "Boss Battle") catHeaderClass = "bg-yellow-400 text-black";
        if (cat === "Mini Quest") catHeaderClass = "bg-cyan-500 text-black";

        col.innerHTML = `
          <div class="${catHeaderClass} font-bebas text-xl px-3 py-1 font-bold p-slant mb-4 flex justify-between">
            <span>${cat.toUpperCase()}</span>
          </div>
          <div class="space-y-3" id="task-col-${cat.replace(/\s+/g, '')}"></div>
        `;
        grid.appendChild(col);

        const colContainer = col.querySelector(`#task-col-${cat.replace(/\s+/g, '')}`);
        const catTasks = tasks.filter(t => t.category === cat);

        if (catTasks.length === 0) {
          colContainer.innerHTML = `<p class="text-xs text-gray-500 italic py-4 text-center">Belum ada tugas di kategori ini.</p>`;
        }

        catTasks.forEach(t => {
          const item = document.createElement('div');
          item.className = `p-3 border ${t.done ? 'bg-neutral-900/50 border-neutral-800 opacity-60' : 'bg-neutral-900 border-neutral-700'} flex justify-between items-center`;
          item.innerHTML = `
            <div>
              <span class="text-[10px] text-gray-400 font-mono block">${t.subject} &bull; <span class="text-[var(--p-primary)]">${t.deadline || 'Tanpa Deadline'}</span></span>
              <span class="font-bold text-sm ${t.done ? 'line-through text-gray-500' : 'text-white'}">${t.title}</span>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="toggleTask(${t.id})" class="p-2 ${t.done ? 'text-green-400' : 'text-gray-400 hover:text-white'} transition-colors" title="Toggle Selesai">
                <i class="${t.done ? 'fas fa-check-circle text-xl' : 'far fa-circle text-xl'}"></i>
              </button>
              <button onclick="deleteTask(${t.id})" class="p-2 text-red-500 hover:text-red-400 transition-colors" title="Hapus Tugas">
                <i class="fas fa-trash text-sm"></i>
              </button>
            </div>
          `;
          colContainer.appendChild(item);
        });
      });
    }

    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.done = !task.done;
        if (task.done) {
          playSfx('levelup');
          triggerAoaOverlay();
          doActivity('knowledge', 5);
        } else {
          playSfx('click');
        }
        saveData();
        renderTasks();
      }
    }

    function deleteTask(id) {
      playSfx('click');
      tasks = tasks.filter(t => t.id !== id);
      saveData();
      renderTasks();
    }

    function openAddTaskModal() {
      playSfx('click');
      const subjectSelect = document.getElementById('task-subject');
      subjectSelect.innerHTML = '';
      const uniqueSubjects = [...new Set(defaultSchedule.map(s => s.subject))];
      uniqueSubjects.forEach(sub => {
        const opt = document.createElement('option');
        opt.value = sub;
        opt.innerText = sub;
        subjectSelect.appendChild(opt);
      });

      document.getElementById('add-task-modal').classList.remove('hidden');
    }

    function closeAddTaskModal() {
      playSfx('click');
      document.getElementById('add-task-modal').classList.add('hidden');
    }

    function saveNewTask(e) {
      e.preventDefault();
      playSfx('click');
      const title = document.getElementById('task-title').value;
      const subject = document.getElementById('task-subject').value;
      const deadline = document.getElementById('task-deadline').value;
      const category = document.getElementById('task-category').value;

      tasks.push({
        id: Date.now(),
        title,
        subject,
        deadline,
        category,
        done: false
      });

      saveData();
      renderTasks();
      closeAddTaskModal();
      document.getElementById('task-form').reset();
    }

    function triggerAoaOverlay() {
      const overlay = document.getElementById('aoa-container');
      overlay.classList.remove('hidden');
      setTimeout(() => {
        overlay.classList.add('hidden');
      }, 2800);
    }

    /* RENDER SOCIAL LINKS / CONFIDANTS */
    function renderSocialLinks() {
      const grid = document.getElementById('social-links-grid');
      grid.innerHTML = '';

      if (socialLinks.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center text-gray-500 py-8 font-bebas text-2xl">BELUM ADA CONFIDANT. TAMBAHKAN MELALUI TOMBOL DI ATAS!</div>`;
        return;
      }

      socialLinks.forEach((s) => {
        const card = document.createElement('div');
        card.className = "bg-black border-2 border-white p-5 jagged-box shadow-[6px_6px_0px_var(--p-primary)] flex flex-col justify-between";
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-center mb-2">
              <span class="text-xs font-marker text-[var(--p-primary)]">${s.arcana}</span>
              <span class="text-xs bg-neutral-800 text-white px-2 py-0.5 border border-neutral-700 font-mono">RANK ${s.rank}</span>
            </div>
            <h3 class="text-2xl font-bebas text-white tracking-wide mb-1">${s.name}</h3>
            <p class="text-xs text-gray-400 font-bold mb-3">${s.role}</p>
            <p class="text-xs bg-neutral-900 text-gray-300 p-2 border-l-2 border-[var(--p-primary)] mb-4">
              <strong>PERK:</strong> ${s.perk}
            </p>
          </div>
          <div class="flex gap-2">
            <button onclick="raiseSocialLink(${s.id})" class="flex-1 bg-neutral-800 hover:bg-[var(--p-primary)] hover:text-black text-white font-bebas text-base py-1 border border-white transition-colors">
              HANG OUT
            </button>
            <button onclick="deleteSocialLink(${s.id})" class="bg-neutral-800 hover:bg-red-600 text-red-400 hover:text-white px-3 py-1 border border-white transition-colors" title="Hapus Confidant">
              <i class="fas fa-trash text-xs"></i>
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function raiseSocialLink(id) {
      const s = socialLinks.find(item => item.id === id);
      if (s && s.rank < 10) {
        playSfx('levelup');
        s.rank += 1;
        saveData();
        renderSocialLinks();
      } else {
        playSfx('click');
      }
    }

    function deleteSocialLink(id) {
      playSfx('click');
      socialLinks = socialLinks.filter(s => s.id !== id);
      saveData();
      renderSocialLinks();
    }

    function openAddConfidantModal() {
      playSfx('click');
      document.getElementById('add-confidant-modal').classList.remove('hidden');
    }

    function closeAddConfidantModal() {
      playSfx('click');
      document.getElementById('add-confidant-modal').classList.add('hidden');
    }

    function saveNewConfidant(e) {
      e.preventDefault();
      playSfx('click');
      const name = document.getElementById('confidant-name').value;
      const role = document.getElementById('confidant-role').value;
      const arcana = document.getElementById('confidant-arcana').value;
      const perk = document.getElementById('confidant-perk').value;

      socialLinks.push({
        id: Date.now(),
        name,
        role,
        arcana,
        rank: 1,
        perk
      });

      saveData();
      renderSocialLinks();
      closeAddConfidantModal();
      document.getElementById('confidant-form').reset();
    }

    function askIgor(topic) {
      playSfx('velvet');
      const speech = document.getElementById('igor-speech');
      if (topic === 'burnout') {
        speech.innerText = '"Ingatlah wahai mahasiswa, bahkan Persona terkuat pun membutuhkan SP Recovery. Beristirahat sejenak dari layar laptop di Lab tidak akan membuat masa depanmu runtuh."';
      } else if (topic === 'dosbing') {
        speech.innerText = '"Bicaralah pada Dosen Pembimbingmu dengan santun di jam kerja. Sertakan salam, identitas, dan progres yang telah kamu buat. Keberanian (Guts) dan Kebaikan (Kindness) adalah kuncinya."';
      } else if (topic === 'ipk') {
        speech.innerText = '"Keseimbangan adalah segalanya. Jangan hanya mengejar Knowledge, tingkatkan pula Charm dan Social Links dengan kawan-kawanmu untuk membuka takdir terbaik pasca kelulusan."';
      }
    }

    window.onload = function() {
      renderStats();
      filterSchedule('Senin');
      renderTasks();
      renderSocialLinks();
      
      // Auto Play & Set UI to BGM ON on initial load
      updateMusicButtonUI();
      if (!window.masterMuted) {
        playActiveMusic();
      }
    };
  </script>
